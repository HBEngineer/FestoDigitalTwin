<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festo Digital Twin</title>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Three.js OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Three.js GLTFLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MQTT.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>

  <!-- WebGL Render Container -->
  <div id="canvas-container"></div>

  <!-- MQTT Status & Telemetry Overlay Panel -->
  <div id="status-card">
    <div class="status-header">
      <span id="dot" class="status-dot"></span>
      <span id="status">Connecting...</span>
    </div>
    <div class="readout-group">
      <div class="readout-row">
        <span>Slider BS:</span>
        <span id="val-bs" class="readout-value">0</span>
      </div>
      <div class="readout-row">
        <span>Slider TB:</span>
        <span id="val-tb" class="readout-value">0</span>
      </div>
    </div>
  </div>

  <!-- Main Three.js & MQTT Logic -->
  <script src="./main.js"></script>
</body>
</html>
