<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festo Digital Twin - 3D Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* UI Overlay Card */
    #status-card {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 280px;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 10;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #0091ff;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .telemetry-label {
      color: #aaaaaa;
    }

    .telemetry-value {
      font-family: monospace;
      font-weight: bold;
      color: #00ff88;
    }

    /* Controls Styling */
    .section-divider {
      margin: 14px 0 10px 0;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cccccc;
      margin-bottom: 4px;
    }

    .control-header span.val-display {
      font-family: monospace;
      color: #0091ff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #0091ff;
      cursor: pointer;
    }
  </style>

  <!-- Import Three.js and MQTT via ES Modules importmap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mqtt": "https://unpkg.com/mqtt@5.3.4/dist/mqtt.esm.js"
      }
    }
  </script>
</head>
<body>

  <div id="status-card">
    <div class="card-title">Festo ELGD Telemetry</div>
    
    <div class="telemetry-row">
      <span class="telemetry-label">Slider BS:</span>
      <span id="pos-bs" class="telemetry-value">0.00 mm</span>
    </div>
    
    <div class="telemetry-row">
      <span class="telemetry-label">Slider TB:</span>
      <span id="pos-tb" class="telemetry-value">0.00 mm</span>
    </div>

    <hr class="section-divider" />
    
    <div class="card-title" style="font-size: 14px; margin-bottom: 8px;">Lighting Settings</div>

    <div class="control-group">
      <div class="control-header">
        <span>Key Light Intensity</span>
        <span id="val-key" class="val-display">4.2</span>
      </div>
      <input type="range" id="light-key-slider" min="0" max="10" step="0.1" value="4.2">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span>Ambient Intensity</span>
        <span id="val-amb" class="val-display">0.8</span>
      </div>
      <input type="range" id="light-amb-slider" min="0" max="3" step="0.1" value="0.8">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span>Light Elevation (Y)</span>
        <span id="val-pos" class="val-display">-3.5</span>
      </div>
      <input type="range" id="light-pos-slider" min="-10" max="10" step="0.5" value="-3.5">
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
