<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festo Digital Twin</title>

  <link rel="icon" type="image/x-icon" href="/FestoDigitalTwin/favicon.ico">
  
  <!-- Silence favicon 404 warning 
  <link rel="shortcut icon" href="#" />
  -->

  <!-- Relative CSS link -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Three.js Core & Addons (ES modules — ARButton is only ever published
       as a module, so the whole three.js stack must load this way too) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
    }
  }
  </script>

  <!-- MQTT Client -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <!-- Status Overlay -->
  <div id="status-card">
    <div class="status-header">
      <span id="dot"></span>
      <strong id="status">Connecting...</strong>
    </div>
    <div><strong>SliderBS:</strong> <span id="val-bs">0 mm</span></div>
    <div><strong>SliderTB:</strong> <span id="val-tb">0 mm</span></div>
  </div>

  <!-- Retractable Lighting Panel -->
  <div id="light-panel" class="collapsed">
  <div id="light-panel-header">
  <span>Lighting Controls</span>
  <span id="toggle-icon">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </span>
</div>
    <div id="light-panel-body">

      <!-- Hemisphere Light -->
      <div class="control-section">
        <div class="control-section-title">Hemisphere Light</div>
        <div class="control-group">
          <label for="ctrl-hemi">Intensity: <span id="lbl-hemi">1.4</span></label>
          <input type="range" id="ctrl-hemi" min="0" max="10" step="0.1" value="1.4" />
        </div>
        <div class="control-group position-group">
          <label>Position</label>
          <div class="xyz-row">
            <div class="xyz-field">
              <span class="xyz-label">X</span>
              <input type="range" id="ctrl-hemi-x" min="-20" max="20" step="0.5" value="0" />
              <span class="xyz-value" id="lbl-hemi-x">0</span>
            </div>
            <div class="xyz-field">
              <span class="xyz-label">Y</span>
              <input type="range" id="ctrl-hemi-y" min="-20" max="20" step="0.5" value="20" />
              <span class="xyz-value" id="lbl-hemi-y">20</span>
            </div>
            <div class="xyz-field">
              <span class="xyz-label">Z</span>
              <input type="range" id="ctrl-hemi-z" min="-20" max="20" step="0.5" value="0" />
              <span class="xyz-value" id="lbl-hemi-z">0</span>
            </div>
          </div>
        </div>
      </div>

      <hr class="section-divider" />

      <!-- Key Light -->
      <div class="control-section">
        <div class="control-section-title">Key Light</div>
        <div class="control-group">
          <label for="ctrl-key">Intensity: <span id="lbl-key">4.0</span></label>
          <input type="range" id="ctrl-key" min="0" max="10" step="0.1" value="4.0" />
        </div>
        <div class="control-group">
          <label for="ctrl-key-color">Color</label>
          <input type="color" id="ctrl-key-color" value="#ffffff" />
        </div>
        <div class="control-group position-group">
          <label>Position</label>
          <div class="xyz-row">
            <div class="xyz-field">
              <span class="xyz-label">X</span>
              <input type="range" id="ctrl-key-x" min="-20" max="20" step="0.1" value="-3" />
              <span class="xyz-value" id="lbl-key-x">-3</span>
            </div>
            <div class="xyz-field">
              <span class="xyz-label">Y</span>
              <input type="range" id="ctrl-key-y" min="-20" max="20" step="0.1" value="-3.5" />
              <span class="xyz-value" id="lbl-key-y">-3.5</span>
            </div>
            <div class="xyz-field">
              <span class="xyz-label">Z</span>
              <input type="range" id="ctrl-key-z" min="-20" max="20" step="0.1" value="-0.5" />
              <span class="xyz-value" id="lbl-key-z">-0.5</span>
            </div>
          </div>
        </div>
      </div>

      <hr class="section-divider" />

      <!-- Fill Light -->
      <div class="control-section">
        <div class="control-section-title">Fill Light</div>
        <div class="control-group">
          <label for="ctrl-fill">Intensity: <span id="lbl-fill">2.4</span></label>
          <input type="range" id="ctrl-fill" min="0" max="10" step="0.1" value="2.4" />
        </div>
        <div class="control-group">
          <label for="ctrl-fill-color">Color</label>
          <input type="color" id="ctrl-fill-color" value="#ffffff" />
        </div>
        <div class="control-group position-group">
          <label>Position</label>
          <div class="xyz-row">
            <div class="xyz-field">
              <span class="xyz-label">X</span>
              <input type="range" id="ctrl-fill-x" min="-20" max="20" step="0.1" value="-5" />
              <span class="xyz-value" id="lbl-fill-x">-5</span>
            </div>
            <div class="xyz-field">
              <span class="xyz-label">Y</span>
              <input type="range" id="ctrl-fill-y" min="-20" max="20" step="0.1" value="5" />
              <span class="xyz-value" id="lbl-fill-y">5</span>
            </div>
            <div class="xyz-field">
              <span class="xyz-label">Z</span>
              <input type="range" id="ctrl-fill-z" min="-20" max="20" step="0.1" value="-5" />
              <span class="xyz-value" id="lbl-fill-z">-5</span>
            </div>
          </div>
        </div>
      </div>

      <hr class="section-divider" />

      <!-- Ambient Light -->
      <div class="control-section">
        <div class="control-section-title">Ambient Light</div>
        <div class="control-group">
          <label for="ctrl-ambient">Intensity: <span id="lbl-ambient">0.7</span></label>
          <input type="range" id="ctrl-ambient" min="0" max="5" step="0.1" value="0.7" />
        </div>
        <div class="control-group">
          <label for="ctrl-ambient-color">Color</label>
          <input type="color" id="ctrl-ambient-color" value="#ffffff" />
        </div>
      </div>

      <hr class="section-divider" />

      <!-- Scene Background -->
      <div class="control-section">
        <div class="control-section-title">Scene</div>
        <div class="control-group">
          <label for="ctrl-bg-color">Background Color</label>
          <input type="color" id="ctrl-bg-color" value="#2b2d31" />
        </div>
      </div>

      <hr class="section-divider" />

      <!-- Save / Reset Controls -->
      <div class="control-section">
        <div class="button-row">
          <button id="btn-save-default" class="btn btn-primary">Save as Default</button>
        </div>
        <div class="button-row">
          <button id="btn-load-default" class="btn btn-secondary">Reset to Saved Default</button>
          <button id="btn-load-factory" class="btn btn-secondary">Reset to Factory</button>
        </div>
        <div id="save-status" class="save-status"></div>
      </div>

    </div>
  </div>

  <!-- iOS AR Quick Look Button -->
  <a id="ios-ar-btn" class="ios-ar-button" rel="ar" href="./model/festo_actuators.usdz">
    <img src="https://developer.apple.com/ar/3d/glTF/AR_icon.png" width="18" height="18" alt="AR" />
    <span>View in AR (iOS)</span>
  </a>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- iOS Detection -->
  <script>
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
      document.getElementById('ios-ar-btn').style.display = 'flex';
    }
  </script>

  <!-- Main Application Script -->
  <script type="module" src="./main.js"></script>

</body>
</html>
